name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      run_semantic:
        description: 'Run semantic LLM evaluation'
        required: true
        type: boolean
        default: false

jobs:
  deterministic_tests:
    name: Deterministic Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run deterministic tests
      # We deliberately do not provide any secrets here to prove 
      # the pipeline works purely deterministically.
      run: |
        pytest -v --junitxml=test-results-${{ matrix.python-version }}.xml
        
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.python-version }}
        path: test-results-${{ matrix.python-version }}.xml

  semantic_evaluation:
    name: Semantic Evaluation (Opt-In)
    # Only run this job if triggered manually and run_semantic is true
    if: github.event_name == 'workflow_dispatch' && inputs.run_semantic == true
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run semantic tests
      # Mask the secret from logs and explicitly pass it to the environment.
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        echo "::add-mask::$GROQ_API_KEY"
        pytest -m semantic -v -s
